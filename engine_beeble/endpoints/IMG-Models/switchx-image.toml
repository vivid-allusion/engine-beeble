id = "switchx-image"
label = "SwitchX Image"
category = "IMG"
platform = "beeble"
endpoint = "switchx-image"
description = "Beeble SwitchX image compositing: image-to-image that keeps the original subject pixels while changing the look via reference image and/or prompt. Async job API: POST /v1/switchx/generations, poll GET /v1/switchx/generations/{id}."

[general]
image_url_param = "source_uri"
slots = ["reference_image_uri", "alpha_uri"]
required_slots = ["source_uri"]

[params.generation_type]
label = "Generation Type"
type = "select"
default = "image"
hidden = true
options = [
  { value = "image", label = "Image" },
  { value = "video", label = "Video" },
]

[params.alpha_mode]
label = "Alpha Mode"
type = "select"
default = "auto"
options = [
  { value = "auto",   label = "Auto · AI detects the foreground" },
  { value = "fill",   label = "Fill · Keep the scene as-is" },
  { value = "select", label = "Select · Single keyframe mask" },
  { value = "custom", label = "Custom · Full mask" },
]
note = "'custom' and 'select' require alpha_uri"

[params.max_resolution]
label = "Max Resolution"
type = "select"
default = "1080"
options = [
  { value = "720",  label = "720p" },
  { value = "1080", label = "1080p · Default" },
]

[params.seed]
label = "Random Seed"
type = "integer"
min = 0
max = 4294967295
optional = true
hidden = true
description = "Omitted → random seed (different output each run). Same seed + identical inputs → near-identical output."

[params.callback_url]
label = "Callback URL"
type = "text"
optional = true
hidden = true
description = "HTTPS webhook URL notified on completion or failure"

[params.idempotency_key]
label = "Idempotency Key"
type = "text"
optional = true
hidden = true
description = "Deterministic key per logical request; retries return the existing job instead of double-charging"

[params.save_alpha]
label = "Save Alpha Matte"
type = "boolean"
default = false
hidden = true
description = "Also download the output alpha matte (mask) for transparency/compositing. Never sent to the API — engine-side only."